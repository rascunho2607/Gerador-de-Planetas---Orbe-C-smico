        function drawFrameTimeGraph(canvas, history) {
            const ctx = canvas.getContext('2d');
            if (!ctx) return;
            const width = canvas.width;
            const height = canvas.height;
            ctx.clearRect(0, 0, width, height);

            ctx.fillStyle = 'rgba(4, 10, 24, 0.48)';
            ctx.fillRect(0, 0, width, height);
            ctx.strokeStyle = 'rgba(125, 175, 255, 0.18)';
            ctx.lineWidth = 1;
            [16.67, 33.33].forEach((mark) => {
                const y = height - (mark / 50) * height;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            });

            if (history.length < 2) return;
            const maxFrameTime = Math.max(50, Math.max(...history) * 1.15);
            const step = width / Math.max(1, FRAME_TIME_HISTORY_LIMIT - 1);
            const startX = width - (history.length - 1) * step;
            ctx.strokeStyle = '#8fe7ff';
            ctx.lineWidth = 1.35;
            ctx.beginPath();
            history.forEach((value, index) => {
                const x = startX + index * step;
                const y = height - Math.min(1, value / maxFrameTime) * (height - 2) - 1;
                if (index === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.stroke();

            const latest = history[history.length - 1];
            const latestY = height - Math.min(1, latest / maxFrameTime) * (height - 2) - 1;
            ctx.fillStyle = '#d9fbff';
            ctx.fillRect(width - 2, latestY - 1, 2, 2);
        }

        // Animação suave: rotação lenta do planeta + estrelas e anel
        let time = 0;
        let lastRenderStamp = 0;
        let fpsAccumulator = 0;
        let fpsFrames = 0;
        let fpsLastSample = performance.now();
        let currentFps = 0;
        let lastFrameTimeMs = 0;
        const FRAME_TIME_HISTORY_LIMIT = 180;
        const frameTimeHistory = [];
        let autoQualityCooldown = 0;
        function animate() {
            requestAnimationFrame(animate);
            const now = performance.now();
            if (editorState.pauseWhenHidden && document.hidden) return;
            if (isRegeneratingPlanet) return;
            const targetFps = editorState.powerSaveMode ? 30 : editorState.targetFps;
            if (targetFps !== 'unlimited') {
                const frameInterval = 1000 / Number(targetFps || 60);
                if (lastRenderStamp && now - lastRenderStamp < frameInterval * 0.92) return;
            }
            lastRenderStamp = now;
            const deltaTime = Math.min(0.05, clock.getDelta());
            lastFrameTimeMs = deltaTime * 1000;
            time += 0.005;
            fpsAccumulator += deltaTime;
            fpsFrames++;
            if (now - fpsLastSample >= 500) {
                currentFps = fpsFrames / Math.max(0.001, fpsAccumulator);
                fpsAccumulator = 0;
                fpsFrames = 0;
                fpsLastSample = now;
                settingsPanel?.updateStats(getPerformanceStats());
                autoQualityCooldown -= 0.5;
                if (editorState.autoPerformanceOptimization && currentFps > 0 && currentFps < 34 && autoQualityCooldown <= 0) {
                    if (editorState.internalResolution > 0.75) {
                        editorState.internalResolution = Math.max(0.75, Number(editorState.internalResolution) - 0.25);
                        applyGraphicsSettings();
                        syncControlsFromState();
                        settingsPanel?.setSettings(editorState, { save: true });
                        showAutoOptimizationNotice('Otimizacao automatica reduziu a resolucao interna para melhorar FPS.');
                        autoQualityCooldown = 4;
                    }
                    if (editorState.particleMultiplier > 0.55) {
                        editorState.particleMultiplier = Math.max(0.55, Number(editorState.particleMultiplier) - 0.15);
                        syncControlsFromState();
                        settingsPanel?.setSettings(editorState, { save: true });
                        showAutoOptimizationNotice('Otimizacao automatica reduziu particulas para melhorar FPS.');
                        scheduleRegenerate(120);
                        autoQualityCooldown = 4;
                    }
                    if (planetChaos) {
                        editorState.chaosQuality = 'low';
                        editorState.chaosMaxEffects = Math.max(20, Math.floor(Number(editorState.chaosMaxEffects || 72) * 0.72));
                        editorState.chaosMaxFragments = Math.max(10, Math.floor(Number(editorState.chaosMaxFragments || 56) * 0.65));
                        planetChaos.configure(editorState);
                        planetChaos.reduceQualityStep?.();
                        syncControlsFromState();
                        settingsPanel?.setSettings(editorState, { save: true });
                        showAutoOptimizationNotice('Otimizacao automatica reduziu efeitos de caos para melhorar FPS.');
                        autoQualityCooldown = 4;
                    }
                    if (editorState.fluidEffectsEnabled) {
                        const fluidPatch = cosmicFluidEffects.reduceQualityStep?.();
                        if (fluidPatch) {
                            Object.assign(editorState, fluidPatch);
                            cosmicFluidEffects.configure?.(editorState);
                            syncControlsFromState();
                            settingsPanel?.setSettings(editorState, { save: true });
                            showAutoOptimizationNotice('Otimizacao automatica reduziu efeitos fluidos para melhorar FPS.');
                            autoQualityCooldown = 4;
                        }
                    }
                    if (editorState.vegetationEnabled && editorState.vegetationDensity !== 'low') {
                        const vegetationPatch = vegetationSystem.reduceQualityStep?.();
                        if (vegetationPatch) {
                            Object.assign(editorState, vegetationPatch);
                            syncControlsFromState();
                            settingsPanel?.setSettings(editorState, { save: true });
                            showAutoOptimizationNotice('Otimizacao automatica reduziu vegetacao para melhorar FPS.');
                            autoQualityCooldown = 4;
                        }
                    }
                }
            }
            updatePerformanceOverlay(deltaTime);
            
            if (currentPlanetMesh) {
                if (currentProfile?.type === 'blackhole') {
                    currentPlanetMesh.rotation.y += editorState.rotationSpeed;
                } else {
                    planetSurfaceGroup.rotation.y += editorState.rotationSpeed;
                    planetSurfaceGroup.rotation.x = Math.sin(time * 0.1) * 0.05;
                    planetSurfaceGroup.rotation.z = Math.cos(time * 0.13) * 0.03;
                }
            }
            orbitingObjects.forEach(({ object, speed }) => {
                if (!object?.parent) return;
                object.rotation.y += speed;
                if (object.userData?.debris) {
                    object.children.forEach((debris) => {
                        debris.userData.orbitPhase += debris.userData.orbitSpeed;
                        const phase = debris.userData.orbitPhase;
                        const radius = debris.userData.orbitRadius;
                        debris.position.x = Math.cos(phase) * radius;
                        debris.position.z = Math.sin(phase) * radius;
                        debris.position.y = debris.userData.orbitHeight + Math.sin(phase * 2.7) * debris.userData.orbitWobble;
                        debris.rotation.x += 0.003;
                        debris.rotation.y += 0.002;
                    });
                }
            });
            const reduceDistantUpdates = editorState.distantUpdateReduction && camera.position.length() > PLANET_RADIUS * 7;
            slowSpinners.forEach((object, index) => {
                if (!object?.parent) return;
                if (reduceDistantUpdates && index % 2 === Math.floor(time * 10) % 2) return;
                if (object.userData?.cloudLayer) {
                    object.rotation.y += object.userData.cloudSpeed;
                    object.rotation.z += object.userData.cloudDrift;
                    return;
                }
                if (object.userData?.blackHole) {
                    object.userData.disk.rotation.z += 0.006;
                    object.userData.photonRing.rotation.z -= 0.003;
                    object.userData.lens.rotation.y += 0.001;
                    object.rotation.y += 0.00025;
                    return;
                }
                if (object.material?.isSpriteMaterial) {
                    object.material.rotation += 0.00035 + index * 0.000002;
                } else {
                    object.rotation.y += 0.0008 + index * 0.00001;
                }
            });
            // estrelas giram bem devagar
            stars.rotation.y += 0.0005;
            stars.rotation.x += 0.0003;
            brightStars.rotation.y -= 0.00022;
            brightStars.rotation.x += 0.00012;
            nebulaRing.rotation.z += 0.0004;
            nebulaRing.rotation.x += 0.0002;
            dinoLife.update(deltaTime);
            universeExpansion.update(deltaTime, time);
            planetChaos?.update(deltaTime);
            reinforcementSystem.update(deltaTime);
            vehicleSystem.update(deltaTime);
            surfaceExploration.updateExplorationControls(deltaTime);
            vegetationSystem.update(deltaTime, camera);
            cosmicFluidEffects.update(deltaTime, time);
            
            if (!surfaceExploration.isExplorationModeActive() && !vehicleSystem.isVehicleModeActive()) {
                controls.update(); // atualiza se houver interação
            }
            updateCinematicLighting(deltaTime, cinematicLighting, {
                sunPosition: mainLight.position,
                planetMesh: currentPlanetMesh?.isMesh ? currentPlanetMesh : null,
                atmosphereMesh: window.atmoMesh,
                profile: currentProfile,
                waterLevel: editorState.waterLevel,
                atmosphereColor: editorState.atmosphereColor,
                atmosphereIntensity: editorState.atmosphereIntensity,
                baseLightIntensity: editorState.lightIntensity,
                baseAmbientIntensity: editorState.ambientIntensity
            });
            const lensMaxCount = getLensMaxCount();
            const lensData = lensMaxCount > 0 ? [...collectLocalBlackHoleLensData(lensMaxCount), ...universeExpansion.collectLensData(lensMaxCount)].slice(0, lensMaxCount) : [];
            blackHoleLensPass.uniforms.lensCount.value = lensData.length;
            blackHoleLensPass.uniforms.lensA.value.set(lensData[0]?.x || 0, lensData[0]?.y || 0, lensData[0]?.radius || 0, lensData[0]?.strength || 0);
            blackHoleLensPass.uniforms.lensB.value.set(lensData[1]?.x || 0, lensData[1]?.y || 0, lensData[1]?.radius || 0, lensData[1]?.strength || 0);
            blackHoleLensPass.uniforms.lensC.value.set(lensData[2]?.x || 0, lensData[2]?.y || 0, lensData[2]?.radius || 0, lensData[2]?.strength || 0);
            blackHoleLensPass.uniforms.lensD.value.set(lensData[3]?.x || 0, lensData[3]?.y || 0, lensData[3]?.radius || 0, lensData[3]?.strength || 0);
            blackHoleLensPass.uniforms.lensE.value.set(lensData[4]?.x || 0, lensData[4]?.y || 0, lensData[4]?.radius || 0, lensData[4]?.strength || 0);
            blackHoleLensPass.uniforms.time.value = time;
            renderFrameSafely(deltaTime);
        }
        
        animate();
        
        // Ajuste de janela responsivo
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            applyGraphicsSettings();
            composer.setSize(window.innerWidth, window.innerHeight);
            blackHoleLensPass.uniforms.resolution.value.set(window.innerWidth, window.innerHeight);
        }
        
        // Tooltip inicial sutil
        console.log('Gerador de Planetas Ativo | Movimente com mouse');
    </script>
</body>
</html>
