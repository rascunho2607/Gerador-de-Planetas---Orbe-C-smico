<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gerador de Planetas - Orbe Cósmico</title>
    <!-- Google Fonts e Font Awesome para estilo e ícones -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Biblioteca Three.js para renderização 3D e Noise (simplex) para texturas orgânicas -->
    <link rel="icon" href="data:,">
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/",
                "simplex-noise": "https://cdn.skypack.dev/simplex-noise@2.1.0"
            }
        }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
            background-color: #03030f;
            color: #f0f0f0;
        }

        /* Canvas 3D ocupa toda a tela */
        canvas {
            display: block;
            vertical-align: bottom;
        }

        /* Interface principal */
        .ui {
            position: absolute;
            bottom: 104px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 20px;
            z-index: 10;
            pointer-events: none;
        }

        button {
            pointer-events: auto;
            background: rgba(10, 10, 30, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(100, 150, 255, 0.5);
            color: white;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 1.1rem;
            padding: 12px 28px;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(0, 20, 100, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        button i {
            font-size: 1.2rem;
        }

        button:hover {
            background: rgba(30, 60, 120, 0.9);
            border-color: #7a9eff;
            transform: scale(1.02);
            box-shadow: 0 0 25px rgba(70, 130, 255, 0.5);
        }

        button:active {
            transform: scale(0.98);
        }

        .info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            padding: 12px 20px;
            border-radius: 32px;
            border-left: 3px solid #5f9eff;
            font-size: 0.9rem;
            font-weight: 400;
            z-index: 10;
            pointer-events: none;
            font-family: monospace;
            letter-spacing: 0.5px;
        }

        .info-panel h1 {
            font-size: 1.1rem;
            margin-bottom: 4px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-panel p {
            font-size: 0.75rem;
            opacity: 0.8;
        }

        .seed-value {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.5);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-family: monospace;
            pointer-events: none;
            z-index: 10;
            backdrop-filter: blur(4px);
        }

        .editor-panel {
            position: absolute;
            top: 96px;
            width: min(330px, calc(100vw - 28px));
            max-height: calc(100vh - 250px);
            overflow: auto;
            z-index: 12;
            pointer-events: auto;
            background: rgba(5, 8, 22, 0.74);
            border: 1px solid rgba(120, 165, 255, 0.24);
            border-radius: 8px;
            box-shadow: 0 18px 60px rgba(0,0,0,0.42);
            backdrop-filter: blur(16px);
            scrollbar-width: thin;
        }

        .planet-panel { left: 20px; }
        .universe-panel { right: 20px; }

        .editor-panel summary {
            cursor: pointer;
            list-style: none;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 700;
            letter-spacing: 0.04em;
            border-bottom: 1px solid rgba(120, 165, 255, 0.14);
        }

        .editor-panel summary::-webkit-details-marker { display: none; }

        .panel-body {
            display: grid;
            gap: 14px;
            padding: 14px;
        }

        .control-group {
            display: grid;
            gap: 9px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .control-group:last-child { border-bottom: 0; padding-bottom: 0; }

        .control-title {
            font-size: 0.72rem;
            font-weight: 700;
            color: #9ebcff;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        label.control-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            align-items: center;
            font-size: 0.76rem;
            color: rgba(240,245,255,0.86);
        }

        label.control-row input[type="range"] {
            grid-column: 1 / -1;
            width: 100%;
        }

        select,
        input[type="color"],
        input[type="number"] {
            width: 100%;
            min-height: 32px;
            background: rgba(3, 8, 22, 0.9);
            color: #f3f7ff;
            border: 1px solid rgba(120,165,255,0.28);
            border-radius: 6px;
            padding: 6px 8px;
            font-family: inherit;
        }

        input[type="color"] {
            padding: 2px;
            width: 46px;
        }

        input[type="range"] {
            accent-color: #7ca8ff;
        }

        .inline-control {
            display: grid;
            grid-template-columns: 1fr 46px;
            gap: 10px;
            align-items: center;
        }

        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-size: 0.78rem;
            color: rgba(240,245,255,0.88);
        }

        .toggle-row input {
            width: 18px;
            height: 18px;
            accent-color: #7ca8ff;
        }

        .top-actions {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 14;
            pointer-events: auto;
        }

        .top-actions button {
            width: 42px;
            height: 42px;
            padding: 0;
            justify-content: center;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        .top-actions button.active {
            background: rgba(35, 74, 145, 0.92);
            border-color: rgba(150, 190, 255, 0.8);
            box-shadow: 0 0 24px rgba(90, 145, 255, 0.38);
        }

        .performance-overlay {
            position: absolute;
            top: 82px;
            left: 18px;
            z-index: 31;
            display: none;
            min-width: 360px;
            padding: 8px 10px;
            border: 1px solid rgba(126, 178, 255, 0.28);
            border-radius: 8px;
            background: rgba(2, 6, 16, 0.62);
            color: rgba(239, 247, 255, 0.92);
            font: 700 11px/1.45 Consolas, 'Courier New', monospace;
            letter-spacing: 0;
            pointer-events: none;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
        }

        body.ui-hidden .performance-overlay,
        body.wallpaper-mode .performance-overlay {
            top: 16px;
        }

        .performance-overlay.is-visible {
            display: block;
        }

        .performance-row {
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .performance-row span {
            display: inline-block;
            white-space: pre;
        }

        .performance-row canvas {
            width: 180px;
            height: 28px;
            border-left: 1px solid rgba(140, 190, 255, 0.18);
            border-right: 1px solid rgba(140, 190, 255, 0.18);
        }

        body.wallpaper-mode .editor-panel,
        body.wallpaper-mode .ui,
        body.wallpaper-mode .info-panel,
        body.wallpaper-mode .seed-value {
            opacity: 0;
            pointer-events: none;
        }

        body.wallpaper-mode .top-actions {
            opacity: 0.22;
            transition: opacity 0.2s ease;
        }

        body.wallpaper-mode .top-actions:hover { opacity: 1; }

        body.settings-open .planet-panel,
        body.settings-open .universe-panel {
            display: none;
        }

        @media (max-width: 600px) {
            button { padding: 8px 18px; font-size: 0.9rem; }
            .info-panel { top: 12px; left: 12px; padding: 8px 14px; }
            .info-panel h1 { font-size: 0.9rem; }
            .editor-panel {
                top: auto;
                bottom: 96px;
                max-height: 42vh;
            }
            .planet-panel { left: 14px; }
            .universe-panel { right: 14px; display: none; }
            .ui { bottom: 148px; gap: 10px; }
            .seed-value { right: 12px; bottom: 96px; }
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <h1><i class="fas fa-globe-americas"></i> GERADOR DE PLANETAS PROCEDURAIS</h1>
        <p>Terreno dinâmico | Cores orgânicas | Rotação suave</p>
    </div>
    <div class="top-actions">
        <button id="toggleSettingsBtn" title="Configurações"><i class="fas fa-sliders-h"></i></button>
        <button id="toggleUiBtn" title="Ocultar interface"><i class="fas fa-eye"></i></button>
    </div>
    <details class="editor-panel planet-panel" open>
        <summary><span><i class="fas fa-globe"></i> PLANETA</span><i class="fas fa-chevron-down"></i></summary>
        <div class="panel-body">
            <div class="control-group">
                <div class="control-title">Preset e tipo</div>
                <label class="control-row">Objeto principal
                    <select id="objectType">
                        <option value="terrestrial">Terra / Rochoso</option>
                        <option value="oceanic">Oceanico</option>
                        <option value="desert">Desertico</option>
                        <option value="ice">Gelado</option>
                        <option value="volcanic">Vulcanico</option>
                        <option value="alien">Alienigena</option>
                        <option value="gas">Gasoso</option>
                        <option value="star">Estrela</option>
                        <option value="blackhole">Buraco negro</option>
                    </select>
                </label>
                <label class="control-row">Preset
                    <select id="planetPreset">
                        <option value="earth">Terra cinematografica</option>
                        <option value="oceanic">Oceanico</option>
                        <option value="desert">Desertico</option>
                        <option value="ice">Gelado</option>
                        <option value="volcanic">Vulcanico</option>
                        <option value="alien">Alienigena</option>
                        <option value="gas">Gasoso</option>
                        <option value="star">Estrela</option>
                        <option value="blackhole">Buraco negro</option>
                    </select>
                </label>
            </div>
            <div class="control-group">
                <div class="control-title">Superficie</div>
                <label class="control-row">Agua / oceanos <span data-value-for="waterLevel"></span><input id="waterLevel" type="range" min="0" max="1" step="0.01"></label>
                <label class="control-row">Montanhas <span data-value-for="mountainIntensity"></span><input id="mountainIntensity" type="range" min="0" max="2" step="0.01"></label>
                <label class="control-row">Deformacao <span data-value-for="deformation"></span><input id="deformation" type="range" min="0" max="1.7" step="0.01"></label>
                <label class="control-row">Faixas / tempestades <span data-value-for="stormIntensity"></span><input id="stormIntensity" type="range" min="0" max="2" step="0.01"></label>
                <label class="control-row">Rotacao <span data-value-for="rotationSpeed"></span><input id="rotationSpeed" type="range" min="0" max="0.01" step="0.0001"></label>
            </div>
            <div class="control-group">
                <div class="control-title">Atmosfera e nuvens</div>
                <label class="toggle-row">Nuvens pseudo-volumetricas <input id="cloudsEnabled" type="checkbox"></label>
                <label class="control-row">Opacidade das nuvens <span data-value-for="cloudOpacity"></span><input id="cloudOpacity" type="range" min="0" max="0.7" step="0.01"></label>
                <label class="control-row">Atmosfera <span data-value-for="atmosphereIntensity"></span><input id="atmosphereIntensity" type="range" min="0" max="0.5" step="0.01"></label>
                <label class="inline-control">Cor da atmosfera <input id="atmosphereColor" type="color"></label>
            </div>
            <div class="control-group">
                <div class="control-title">Luas e aneis</div>
                <label class="toggle-row">Luas <input id="moonsEnabled" type="checkbox"></label>
                <label class="control-row">Quantidade <span data-value-for="moonCount"></span><input id="moonCount" type="range" min="0" max="6" step="1"></label>
                <label class="control-row">Distancia orbital <span data-value-for="moonDistance"></span><input id="moonDistance" type="range" min="1.7" max="5.5" step="0.1"></label>
                <label class="control-row">Velocidade orbital <span data-value-for="moonSpeed"></span><input id="moonSpeed" type="range" min="0" max="2.5" step="0.05"></label>
                <label class="toggle-row">Aneis <input id="ringsEnabled" type="checkbox"></label>
                <label class="control-row">Largura dos aneis <span data-value-for="ringWidth"></span><input id="ringWidth" type="range" min="0.3" max="1.6" step="0.05"></label>
                <label class="control-row">Opacidade <span data-value-for="ringOpacity"></span><input id="ringOpacity" type="range" min="0.05" max="0.8" step="0.01"></label>
                <label class="inline-control">Cor dos aneis <input id="ringColor" type="color"></label>
            </div>
            <div class="control-group">
                <div class="control-title">Vida</div>
                <label class="toggle-row">Habilitar dinos <input id="lifeEnabled" type="checkbox"></label>
                <label class="control-row">Tipo de vida
                    <select id="lifeType">
                        <option value="dinosaurs">Dinossauros</option>
                    </select>
                </label>
                <label class="control-row">Especies
                    <select id="dinoSpecies" multiple size="5">
                        <option value="Blue Raptor">Blue Raptor</option>
                        <option value="Green Raptor">Green Raptor</option>
                        <option value="Red Raptor">Red Raptor</option>
                        <option value="Velociraptor">Velociraptor</option>
                        <option value="T-Rex">T-Rex</option>
                        <option value="Triceratops">Triceratops</option>
                        <option value="Stegosaurus">Stegosaurus</option>
                        <option value="Gallimimus">Gallimimus</option>
                        <option value="Parasaurolophus">Parasaurolophus</option>
                        <option value="Dilophosaurus">Dilophosaurus</option>
                        <option value="Crocodile">Crocodile</option>
                        <option value="ELITE T-Rex">ELITE T-Rex</option>
                        <option value="ELITE Triceratops">ELITE Triceratops</option>
                        <option value="ELITE Stegosaurus">ELITE Stegosaurus</option>
                        <option value="ELITE Brachiosaurus">ELITE Brachiosaurus</option>
                    </select>
                </label>
                <label class="control-row">Quantidade <span data-value-for="dinoCount"></span><input id="dinoCount" type="range" min="0" max="80" step="1"></label>
                <label class="control-row">Tamanho <span data-value-for="dinoScale"></span><input id="dinoScale" type="range" min="0.45" max="2.2" step="0.05"></label>
                <label class="control-row">Velocidade <span data-value-for="dinoMoveSpeed"></span><input id="dinoMoveSpeed" type="range" min="0.2" max="3" step="0.05"></label>
                <label class="control-row">Distancia render <span data-value-for="dinoRenderDistance"></span><input id="dinoRenderDistance" type="range" min="12" max="70" step="1"></label>
                <label class="control-row">Distancia animar <span data-value-for="dinoAnimateDistance"></span><input id="dinoAnimateDistance" type="range" min="8" max="55" step="1"></label>
                <button id="regenerateDinosBtn" type="button"><i class="fas fa-paw"></i> REGENERAR DINOS</button>
            </div>
        </div>
    </details>
    <details class="editor-panel universe-panel" open>
        <summary><span><i class="fas fa-meteor"></i> UNIVERSO</span><i class="fas fa-chevron-down"></i></summary>
        <div class="panel-body">
            <div class="control-group">
                <div class="control-title">Preset</div>
                <label class="control-row">Ambiente
                    <select id="universePreset">
                        <option value="deep">Espaco profundo</option>
                        <option value="realistic">Sistema solar realista</option>
                        <option value="nebula">Nebulosa colorida</option>
                        <option value="galaxy">Galaxia distante</option>
                        <option value="asteroids">Campo de asteroides</option>
                        <option value="star-orbit">Orbita de uma estrela</option>
                        <option value="black-region">Regiao de buraco negro</option>
                        <option value="minimal">Universo escuro minimalista</option>
                        <option value="scifi">Wallpaper sci-fi colorido</option>
                    </select>
                </label>
            </div>
            <div class="control-group">
                <div class="control-title">Fundo</div>
                <label class="control-row">Densidade de estrelas <span data-value-for="starDensity"></span><input id="starDensity" type="range" min="0.1" max="1" step="0.01"></label>
                <label class="control-row">Brilho das estrelas <span data-value-for="starBrightness"></span><input id="starBrightness" type="range" min="0.05" max="1" step="0.01"></label>
                <label class="control-row">Tamanho das estrelas <span data-value-for="starSize"></span><input id="starSize" type="range" min="0.08" max="0.8" step="0.01"></label>
                <label class="inline-control">Cor do fundo <input id="backgroundColor" type="color"></label>
                <label class="toggle-row">Nebulosas <input id="nebulaEnabled" type="checkbox"></label>
                <label class="control-row">Intensidade nebulosa <span data-value-for="nebulaIntensity"></span><input id="nebulaIntensity" type="range" min="0" max="1" step="0.01"></label>
                <label class="toggle-row">Galaxia distante <input id="galaxyEnabled" type="checkbox"></label>
            </div>
            <div class="control-group">
                <div class="control-title">Objetos decorativos</div>
                <label class="control-row">Planetas distantes <span data-value-for="distantPlanets"></span><input id="distantPlanets" type="range" min="0" max="5" step="1"></label>
                <label class="control-row">Asteroides <span data-value-for="asteroidCount"></span><input id="asteroidCount" type="range" min="0" max="80" step="5"></label>
                <label class="control-row">Cometas <span data-value-for="comets"></span><input id="comets" type="range" min="0" max="3" step="1"></label>
                <label class="control-row">Buracos negros distantes <span data-value-for="blackHoles"></span><input id="blackHoles" type="range" min="0" max="2" step="1"></label>
            </div>
            <div class="control-group">
                <div class="control-title">Sistema Cosmico</div>
                <label class="toggle-row">Buracos negros cinematicos <input id="cosmicBlackHolesEnabled" type="checkbox"></label>
                <label class="toggle-row">Cometas animados <input id="cosmicCometsEnabled" type="checkbox"></label>
                <label class="toggle-row">Nebulosas animadas <input id="cosmicNebulasEnabled" type="checkbox"></label>
                <label class="toggle-row">Satelites / estacoes <input id="cosmicStationsEnabled" type="checkbox"></label>
                <label class="toggle-row">Sistema solar distante <input id="cosmicPlanetsEnabled" type="checkbox"></label>
                <label class="toggle-row">Orbitas visuais <input id="cosmicOrbitLinesEnabled" type="checkbox"></label>
                <label class="toggle-row">Lente gravitacional avancada <input id="cosmicLensDistortionEnabled" type="checkbox"></label>
                <label class="control-row">Quantidade de cometas <span data-value-for="cosmicCometCount"></span><input id="cosmicCometCount" type="range" min="0" max="10" step="1"></label>
                <label class="control-row">Tamanho da cauda <span data-value-for="cosmicCometTailIntensity"></span><input id="cosmicCometTailIntensity" type="range" min="0.4" max="2.5" step="0.05"></label>
                <label class="control-row">Planetas secundarios <span data-value-for="cosmicPlanetCount"></span><input id="cosmicPlanetCount" type="range" min="0" max="8" step="1"></label>
                <label class="control-row">Satelites / estacoes <span data-value-for="cosmicStationCount"></span><input id="cosmicStationCount" type="range" min="0" max="8" step="1"></label>
                <label class="control-row">Buracos negros <span data-value-for="cosmicBlackHoleCount"></span><input id="cosmicBlackHoleCount" type="range" min="0" max="2" step="1"></label>
            </div>
            <div class="control-group">
                <div class="control-title">Luz e cinema</div>
                <label class="toggle-row">Iluminacao Cinematografica <input id="cinematicLightingEnabled" type="checkbox"></label>
                <label class="control-row">Preset de luz
                    <select id="cinematicLightingPreset">
                        <option value="low">Baixo</option>
                        <option value="medium">Medio</option>
                        <option value="high">Alto</option>
                        <option value="cinematic">Cinematografico</option>
                    </select>
                </label>
                <label class="control-row">Sol X <span data-value-for="sunX"></span><input id="sunX" type="range" min="-10" max="10" step="0.1"></label>
                <label class="control-row">Sol Y <span data-value-for="sunY"></span><input id="sunY" type="range" min="-4" max="6" step="0.1"></label>
                <label class="control-row">Luz principal <span data-value-for="lightIntensity"></span><input id="lightIntensity" type="range" min="0" max="3" step="0.05"></label>
                <label class="control-row">Luz ambiente <span data-value-for="ambientIntensity"></span><input id="ambientIntensity" type="range" min="0" max="1.2" step="0.02"></label>
                <label class="control-row">Exposicao <span data-value-for="exposure"></span><input id="exposure" type="range" min="0.5" max="1.8" step="0.01"></label>
                <label class="control-row">Exposicao cinema <span data-value-for="cinematicExposure"></span><input id="cinematicExposure" type="range" min="0.6" max="1.8" step="0.01"></label>
                <label class="control-row">Contraste cinema <span data-value-for="cinematicContrast"></span><input id="cinematicContrast" type="range" min="0.85" max="1.45" step="0.01"></label>
                <label class="control-row">Intensidade cinema <span data-value-for="cinematicIntensity"></span><input id="cinematicIntensity" type="range" min="0.45" max="1.8" step="0.01"></label>
                <label class="toggle-row">Bloom emissivo <input id="cinematicBloom" type="checkbox"></label>
                <label class="control-row">Forca do bloom <span data-value-for="cinematicBloomStrength"></span><input id="cinematicBloomStrength" type="range" min="0" max="1.4" step="0.01"></label>
                <label class="control-row">Sombras
                    <select id="cinematicShadowQuality">
                        <option value="off">Desligadas</option>
                        <option value="low">Baixa</option>
                        <option value="medium">Media</option>
                        <option value="high">Alta</option>
                    </select>
                </label>
                <label class="toggle-row">Oclusao fake <input id="cinematicAmbientOcclusion" type="checkbox"></label>
            </div>
        </div>
    </details>
    <div class="ui">
        <button id="randomizeBtn"><i class="fas fa-dice-d6"></i> NOVO PLANETA</button>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';

        import { VehicleSystem } from './js/vehicle-system.js';
        import { ReinforcementSystem } from './js/reinforcement-system.js';

        const PLANET_RADIUS = 10;

        // --- Setup da cena, câmera, renderizador ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x03030f);
        scene.fog = new THREE.FogExp2(0x03030f, 0.0008); // névoa sutil para profundidade

        // Câmera perspectiva
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.05, 3000);
        camera.position.set(0, 20, 50);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        if ('outputColorSpace' in renderer && THREE.SRGBColorSpace) {
            renderer.outputColorSpace = THREE.SRGBColorSpace;
        } else {
            renderer.outputEncoding = THREE.sRGBEncoding;
        }
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        renderer.shadowMap.enabled = true; // sombras para estrelas? não essencial mas elegante
        document.body.appendChild(renderer.domElement);

        const blackHoleLensShader = {
            uniforms: {
                tDiffuse: { value: null },
                lensCount: { value: 0 },
                lensA: { value: new THREE.Vector4(0, 0, 0, 0) },
                lensB: { value: new THREE.Vector4(0, 0, 0, 0) },
                lensC: { value: new THREE.Vector4(0, 0, 0, 0) },
                lensD: { value: new THREE.Vector4(0, 0, 0, 0) },
                lensE: { value: new THREE.Vector4(0, 0, 0, 0) },
                resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                time: { value: 0 }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform int lensCount;
                uniform vec4 lensA;
                uniform vec4 lensB;
                uniform vec4 lensC;
                uniform vec4 lensD;
                uniform vec4 lensE;
                uniform vec2 resolution;
                uniform float time;
                varying vec2 vUv;

                vec2 lensWarp(vec2 uv, vec4 lens) {
                    vec2 delta = uv - lens.xy;
                    delta.x *= resolution.x / resolution.y;
                    float d = length(delta);
                    float radius = lens.z;
                    if (d <= 0.0001 || d > radius) return uv;

                    float horizon = radius * 0.18;
                    float bend = smoothstep(radius, horizon, d);
                    float ring = exp(-pow((d - radius * 0.35) / max(radius * 0.09, 0.001), 2.0));
                    vec2 direction = normalize(delta);
                    direction.x /= resolution.x / resolution.y;
                    vec2 tangent = vec2(-direction.y, direction.x);
                    float strength = lens.w;
                    float radialPull = strength * bend * (0.018 / max(d, 0.022));
                    float swirl = sin(d * 85.0 - time * 0.85) * strength * ring * 0.018;
                    return uv - direction * radialPull + tangent * swirl;
                }

                vec3 lensGrade(vec2 uv, vec3 color, vec4 lens) {
                    vec2 delta = uv - lens.xy;
                    delta.x *= resolution.x / resolution.y;
                    float d = length(delta);
                    float radius = lens.z;
                    if (d > radius) return color;

                    float horizon = smoothstep(radius * 0.22, radius * 0.08, d);
                    float photonRing = exp(-pow((d - radius * 0.27) / max(radius * 0.035, 0.001), 2.0));
                    float outerShear = exp(-pow((d - radius * 0.56) / max(radius * 0.11, 0.001), 2.0));
                    color *= 1.0 - horizon * 0.82;
                    color += vec3(1.0, 0.58, 0.2) * photonRing * 0.28;
                    color += vec3(0.52, 0.7, 1.0) * outerShear * 0.08;
                    return color;
                }

                void main() {
                    vec2 warpedUv = vUv;
                    if (lensCount > 0) warpedUv = lensWarp(warpedUv, lensA);
                    if (lensCount > 1) warpedUv = lensWarp(warpedUv, lensB);
                    if (lensCount > 2) warpedUv = lensWarp(warpedUv, lensC);
                    if (lensCount > 3) warpedUv = lensWarp(warpedUv, lensD);
                    if (lensCount > 4) warpedUv = lensWarp(warpedUv, lensE);
                    warpedUv = clamp(warpedUv, vec2(0.001), vec2(0.999));
                    vec3 color = texture2D(tDiffuse, warpedUv).rgb;
                    if (lensCount > 0) color = lensGrade(vUv, color, lensA);
                    if (lensCount > 1) color = lensGrade(vUv, color, lensB);
                    if (lensCount > 2) color = lensGrade(vUv, color, lensC);
                    if (lensCount > 3) color = lensGrade(vUv, color, lensD);
                    if (lensCount > 4) color = lensGrade(vUv, color, lensE);
                    gl_FragColor = vec4(color, 1.0);
                }
            `
        };
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const blackHoleLensPass = new ShaderPass(blackHoleLensShader);
        composer.addPass(blackHoleLensPass);
        composer.setSize(window.innerWidth, window.innerHeight);

        // Controles orbitais com suavidade
        const controls = new OrbitControls(camera, renderer.domElement);

        controls.enableZoom = true;
        controls.enablePan = false;
        controls.zoomSpeed = 1.2;
        controls.rotateSpeed = 1.0;
        controls.minDistance = 10.8;
        controls.maxDistance = 180;
        controls.target.set(0, 0, 0);
        const clock = new THREE.Clock();
        
        // --- Iluminação dinâmica e rica para destacar relevo ---
        // Luz ambiente suave
        const ambientLight = new THREE.AmbientLight(0x222222);
        scene.add(ambientLight);
        
        // Luz principal direcional (sol)
        const mainLight = new THREE.DirectionalLight(0xffeedd, 1.2);
        mainLight.position.set(5, 10, 7);
        mainLight.castShadow = true;
        mainLight.receiveShadow = false;
        mainLight.shadow.mapSize.width = 1024;
        mainLight.shadow.mapSize.height = 1024;
        scene.add(mainLight);
        
        // Luz de preenchimento traseira
        const backLight = new THREE.DirectionalLight(0x88aaff, 0.5);
        backLight.position.set(-3, -1, -4);
        scene.add(backLight);
        
        // Luz de realce lateral quente
        const warmFill = new THREE.PointLight(0xffaa66, 0.4);
        warmFill.position.set(2, 1, 3);
        scene.add(warmFill);
        
        // Pequeno ponto de luz para dar brilho nos pólos
        const poleLight = new THREE.PointLight(0x6688ff, 0.3);
        poleLight.position.set(0, 3 * PLANET_RADIUS, 0);
        scene.add(poleLight);
        
        // --- Fundo estelar (partículas) ---
        const starGeometry = new THREE.BufferGeometry();
        const starCount = 2600;
        const starPositions = new Float32Array(starCount * 3);
        const starColors = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            // Distribuição esférica larga
            const depth = Math.random();
            starPositions[i*3] = (Math.random() - 0.5) * 520;
            starPositions[i*3+1] = (Math.random() - 0.5) * 260;
            starPositions[i*3+2] = -40 - depth * 230;
            const tint = new THREE.Color().setHSL(0.58 + Math.random() * 0.14, 0.25, 0.65 + Math.random() * 0.35);
            starColors[i*3] = tint.r;
            starColors[i*3+1] = tint.g;
            starColors[i*3+2] = tint.b;
        }
        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        starGeometry.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
        const starMaterial = new THREE.PointsMaterial({ size: 0.24, transparent: true, opacity: 0.78, vertexColors: true, depthWrite: false });
        const stars = new THREE.Points(starGeometry, starMaterial);
        scene.add(stars);

        const brightStarGeometry = new THREE.BufferGeometry();
        const brightStarPositions = new Float32Array(120 * 3);
        const brightStarColors = new Float32Array(120 * 3);
        for (let i = 0; i < 120; i++) {
            brightStarPositions[i*3] = (Math.random() - 0.5) * 360;
            brightStarPositions[i*3+1] = (Math.random() - 0.5) * 190;
            brightStarPositions[i*3+2] = -70 - Math.random() * 150;
            const color = new THREE.Color().setHSL(0.08 + Math.random() * 0.62, 0.18, 0.78 + Math.random() * 0.2);
            brightStarColors[i*3] = color.r;
            brightStarColors[i*3+1] = color.g;
            brightStarColors[i*3+2] = color.b;
        }
        brightStarGeometry.setAttribute('position', new THREE.BufferAttribute(brightStarPositions, 3));
        brightStarGeometry.setAttribute('color', new THREE.BufferAttribute(brightStarColors, 3));
        const brightStars = new THREE.Points(
            brightStarGeometry,
            new THREE.PointsMaterial({ size: 0.62, transparent: true, opacity: 0.62, vertexColors: true, depthWrite: false })

        scene.add(brightStars);
        
        // Adicionar um anel de nebulosa muito sutil (apenas estético)
        const nebulaRingGeometry = new THREE.BufferGeometry();
        const ringPoints = [];
        for (let i = 0; i < 800; i++) {
            const angle = Math.random() * Math.PI * 2;
            const rad = 4.5 + Math.random() * 1.2;
            const x = Math.cos(angle) * rad;
            const z = Math.sin(angle) * rad;
            const y = (Math.random() - 0.5) * 0.8;
            ringPoints.push(x, y, z);
        }

        const nebulaMat = new THREE.PointsMaterial({ color: 0x88aaff, size: 0.03, transparent: true, opacity: 0.25 });

        const lensTempProjected = new THREE.Vector3();

        const editorState = {

        };
        const defaultEditorState = { ...editorState };
        Object.assign(editorState, loadSettings(defaultEditorState));

        function getCinematicLightingOptions() {
            return {
                enabled: editorState.cinematicLightingEnabled,
                preset: editorState.cinematicLightingPreset,
                toneMapping: true,
                exposure: editorState.cinematicExposure,

        }

        function syncCinematicLightingOptions() {
            updateLightingSettings(getCinematicLightingOptions(), cinematicLighting);
        }

        const cinematicLighting = createCinematicLighting(scene, renderer, camera, {
            ...getCinematicLightingOptions(),
            composer,
            insertBeforePass: blackHoleLensPass,
            lights: {
                mainLight,
                ambientLight,
                backLight,
                warmFill
            }
        });

        const dinoLife = new DinoLifeSystem({
            THREE,
            scene,
            camera,
            parentGroup: planetSurfaceGroup,
            getPlanetRadius: () => PLANET_RADIUS,
            getPlanetCenter: () => new THREE.Vector3(0, 0, 0),

            getPlanetSurfaceHeight: (normal) => samplePlanetSurfaceHeight(normal),

            settings: editorState
        });
        const cosmicFluidEffects = createCosmicFluidEffects({
            THREE,

            camera,

            parentGroup: cosmicGroup,
            planetRadius: PLANET_RADIUS,
            settings: editorState
        });
        const vegetationSystem = new PlanetVegetationSystem({
            THREE,
            parentGroup: planetSurfaceGroup,
            camera,
            getPlanetRadius: () => PLANET_RADIUS,
            getPlanetCenter: () => new THREE.Vector3(0, 0, 0),
            getPlanetSurfaceHeight: (normal) => samplePlanetSurfaceHeight(normal),

        });
        const universeExpansion = new UniverseExpansion({

            planetRadius: PLANET_RADIUS,

        const chaosToolbar = new PlanetChaosToolbar();
        planetChaos = new PlanetChaosSystem({

        });

            document.body.classList.toggle('wallpaper-mode', hidden);
            document.body.classList.toggle('ui-hidden', hidden);
            chaosToolbar.setGlobalUiHidden(hidden);
            const button = document.getElementById('toggleUiBtn');
            button?.classList.toggle('active', hidden);
            if (button) {

                button.innerHTML = hidden ? '<i class="fas fa-eye-slash"></i>' : '<i class="fas fa-eye"></i>';

        }

            setUiHidden(!document.body.classList.contains('ui-hidden'));
        }

        const surfaceExploration = new PlanetExplorationControls({
            THREE,
            scene,
            camera,
            renderer,
            controls,
            surfaceGroup: planetSurfaceGroup,
            getPlanetMesh: () => currentPlanetMesh,
            getPlanetRadius: () => PLANET_RADIUS,
            getPlanetCenter: () => new THREE.Vector3(0, 0, 0),
            getPlanetSurfaceHeight: (normal) => samplePlanetSurfaceHeight(normal),

            onToggleUi: toggleUiHidden,

        const vehicleSystem = new VehicleSystem({
            THREE,
            scene,
            camera,
            renderer,
            controls,
            surfaceGroup: planetSurfaceGroup,
            cosmicGroup,
            getPlanetMesh: () => currentPlanetMesh,

        const reinforcementSystem = new ReinforcementSystem({

            getPlanetMesh: () => currentPlanetMesh,

        });
        surfaceExploration.setExternalInputBlocker(() => reinforcementSystem.isSequenceInputActive());
        surfaceExploration.setExternalEscapeDeferrer(() => reinforcementSystem.isAimingDrop());

        const planetPresets = {
            earth: { objectType: 'terrestrial', waterLevel: 0.36, mountainIntensity: 1, deformation: 0.9, stormIntensity: 0.7, cloudsEnabled: true, cloudOpacity: 0.28, atmosphereIntensity: 0.12, atmosphereColor: '#77baff', ringsEnabled: false, moonsEnabled: true, moonCount: 1, rotationSpeed: 0.002 },

        // PRNG deterministico para a versao CDN do simplex-noise, que espera uma funcao random().
        function createSeededRandom(seed) {
            let state = Number(seed) >>> 0;
            return function random() {
                state = (state + 0x6D2B79F5) >>> 0;
                let t = state;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }

        function randomRange(random, min, max) {
            return min + random() * (max - min);
        }

        function pick(random, values) {
            return values[Math.floor(random() * values.length)];
        }

        function themedValue(random, value) {
            if (Array.isArray(value)) {
                const [min, max] = value;
                if (Number.isInteger(min) && Number.isInteger(max)) return Math.floor(randomRange(random, min, max + 1));
                return randomRange(random, min, max);
            }
            return value;
        }

        function applyThemeValues(target, values, random) {
            Object.entries(values || {}).forEach(([key, value]) => {
                target[key] = themedValue(random, value);
            });
        }

        function isRenderableObject(object) {
            return Boolean(object?.isMesh || object?.isInstancedMesh || object?.isPoints || object?.isLine);
        }

        function disposeMaterialResources(material, textures) {
            if (!material) return;
            Object.keys(material).forEach((key) => {
                const value = material[key];
                if (value?.isTexture) textures.add(value);
            });
        }

        function disposeObject(object) {
            if (!object) return;
            object.parent?.remove(object);
            const geometries = new Set();
            const materials = new Set();
            const textures = new Set();
            object.traverse((child) => {
                if (child.geometry) geometries.add(child.geometry);
                if (child.userData?.cinematicOriginalMaterial) materials.add(child.userData.cinematicOriginalMaterial);
                if (!child.material) return;
                const childMaterials = Array.isArray(child.material) ? child.material : [child.material];
                childMaterials.forEach((material) => {
                    if (!material) return;
                    materials.add(material);
                    disposeMaterialResources(material, textures);
                });
            });
            geometries.forEach((geometry) => geometry.dispose?.());
            textures.forEach((texture) => texture.dispose?.());
            materials.forEach((material) => material.dispose?.());
            object.traverse((child) => {
                if (child.userData?.cinematicOriginalMaterial) child.userData.cinematicOriginalMaterial = null;
            });
        }

        function findInvalidRenderableObjects(root = scene) {
            const invalid = [];
            root.traverse((object) => {
                if (!isRenderableObject(object)) return;
                if (!object.material || (Array.isArray(object.material) && object.material.some((material) => !material))) {
                    invalid.push({ object, reason: 'material invalido' });
                    return;
                }
                const geometry = object.geometry;
                const position = geometry?.attributes?.position;
                if (!geometry || !geometry.attributes || !position || !position.array) {
                    invalid.push({ object, reason: !geometry ? 'sem geometry' : !geometry.attributes ? 'geometry sem attributes' : !position ? 'geometry sem position' : 'position sem array' });
                    return;
                }
                for (const [name, attribute] of Object.entries(geometry.attributes)) {
                    if (!attribute || !attribute.array) {
                        invalid.push({ object, reason: `atributo ${name} invalido` });
                        return;
                    }
                }
                for (const [name, attributes] of Object.entries(geometry.morphAttributes || {})) {
                    if (!Array.isArray(attributes)) continue;
                    const badMorph = attributes.find((attribute) => !attribute || !attribute.array);
                    if (badMorph) {
                        invalid.push({ object, reason: `morph attribute ${name} invalido` });
                        return;
                    }
                }
                if (geometry.index && !geometry.index.array) {
                    invalid.push({ object, reason: 'index buffer invalido' });
                    return;
                }
                if (object.isInstancedMesh && (!object.instanceMatrix || !object.instanceMatrix.array)) {
                    invalid.push({ object, reason: 'InstancedMesh sem instanceMatrix valido' });
                }
            });
            return invalid;
        }

        function removeInvalidRenderableObjects(root = scene) {
            const invalid = findInvalidRenderableObjects(root);
            invalid.forEach(({ object, reason }) => {
                console.warn('Removendo objeto renderizavel invalido antes do render:', reason, object.name || object.type, object);
                object.parent?.remove(object);
            });
            if (invalid.length) needsRenderListFlush = true;
            return invalid.length;
        }

        function renderableDebugName(object) {
            const geometry = object?.geometry;
            const attrs = geometry?.attributes ? Object.keys(geometry.attributes).join(',') : 'sem attrs';
            return `${object?.name || object?.type || 'renderable'} | geom=${geometry?.type || 'null'} | attrs=${attrs}`;
        }

        function isolateRenderFailure(error) {
            console.warn('Render falhou; isolando objeto renderizavel invalido.', error);
            const renderables = [];
            scene.traverse((object) => {
                if (isRenderableObject(object)) renderables.push(object);
            });
            const visibility = renderables.map((object) => [object, object.visible]);
            renderables.forEach((object) => object.visible = false);
            const offenders = [];
            for (const object of renderables) {
                object.visible = true;
                try {
                    renderer.render(scene, camera);
                } catch (candidateError) {
                    offenders.push(object);
                    console.warn('Objeto que quebra render:', renderableDebugName(object), object, candidateError);
                }
                object.visible = false;
            }
            visibility.forEach(([object, visible]) => object.visible = visible);
            offenders.forEach((object) => object.parent?.remove(object));
            if (offenders.length) needsRenderListFlush = true;
            if (!offenders.length) {
                console.warn('Render falhou, mas nenhum objeto isolado reproduziu o erro. Verifique passes/post-processing.', error);
            }
            return offenders.length;
        }

        function renderFrameSafely(deltaTime) {
            removeInvalidRenderableObjects(scene);
            if (needsRenderListFlush) {
                renderer.renderLists?.dispose?.();
                needsRenderListFlush = false;
            }
            try {
                composer.render(deltaTime);
            } catch (error) {
                const removed = isolateRenderFailure(error);
                removeInvalidRenderableObjects(scene);
                renderer.renderLists?.dispose?.();
                const now = performance.now();
                if (now - lastRenderRecoveryLog > 1200) {
                    console.warn(`Frame de render pulado apos recuperacao (${removed} objeto(s) removido(s)).`, error);
                    lastRenderRecoveryLog = now;
                }
            }
        }

        function clearCosmicGroup() {
            needsRenderListFlush = true;
            reinforcementSystem?.clear?.();
            vehicleSystem?.clear?.();
            cosmicFluidEffects.disposeVisuals?.();
            planetChaos?.clearSceneArtifacts?.();
            dinoLife.clearPopulation();
            vegetationSystem?.dispose?.();
            universeExpansion.dispose();
            orbitingObjects.length = 0;
            localChaosTargets.length = 0;
            slowSpinners.length = 0;
            localBlackHoles.length = 0;
            while (planetSurfaceGroup.children.length) {
                const child = planetSurfaceGroup.children[0];
                planetSurfaceGroup.remove(child);
                if (child !== dinoLife.group && child !== reinforcementSystem?.marker) disposeObject(child);
            }
            planetSurfaceGroup.add(dinoLife.group);
            reinforcementSystem?.reattachMarker?.();
            planetSurfaceGroup.rotation.set(0, 0, 0);
            while (cosmicGroup.children.length) {
                const child = cosmicGroup.children[0];
                cosmicGroup.remove(child);
                if (child !== planetSurfaceGroup) disposeObject(child);
            }
            cosmicGroup.add(planetSurfaceGroup);
            currentPlanetMesh = null;
            window.atmoMesh = null;
            surfaceSampler = null;
            planetChaos?.setPlanet(null, null);
        }

        function createGlowTexture(inner, outer) {

        function createNebulaTexture(seed, hueA, hueB) {
            const random = createSeededRandom(seed);
            const canvas = document.createElement('canvas');
            canvas.width = 768;
            canvas.height = 768;
            const ctx = canvas.getContext('2d');
            const size = 768;
            const center = size / 2;
            ctx.clearRect(0, 0, size, size);

            for (let i = 0; i < 56; i++) {
                const spread = randomRange(random, 0, 1);
                const angle = random() * Math.PI * 2;
                const distance = Math.pow(spread, 1.8) * 170;
                const x = center + Math.cos(angle) * distance + randomRange(random, -52, 52);
                const y = center + Math.sin(angle) * distance * 0.72 + randomRange(random, -48, 48);
                const radius = randomRange(random, 70, 210);
                const hue = i % 2 ? hueA : hueB;
                const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
                gradient.addColorStop(0, `hsla(${hue}, 90%, 72%, ${randomRange(random, 0.035, 0.085)})`);
                gradient.addColorStop(0.48, `hsla(${hue}, 80%, 56%, ${randomRange(random, 0.012, 0.028)})`);
                gradient.addColorStop(0.82, `hsla(${hue}, 75%, 45%, ${randomRange(random, 0.002, 0.008)})`);
                gradient.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, size, size);
            }

            const fade = ctx.createRadialGradient(center, center, 120, center, center, 360);
            fade.addColorStop(0, 'rgba(255,255,255,1)');
            fade.addColorStop(0.52, 'rgba(255,255,255,0.72)');
            fade.addColorStop(0.74, 'rgba(255,255,255,0.22)');
            fade.addColorStop(0.9, 'rgba(255,255,255,0.035)');
            fade.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.globalCompositeOperation = 'destination-in';
            ctx.fillStyle = fade;
            ctx.fillRect(0, 0, size, size);
            ctx.globalCompositeOperation = 'source-over';

            const texture = new THREE.CanvasTexture(canvas);
            texture.minFilter = THREE.LinearFilter;
            texture.magFilter = THREE.LinearFilter;
            texture.needsUpdate = true;
            return texture;
        }

        function createRingTexture(seed, colorHex) {
            const random = createSeededRandom(seed);
            const canvas = document.createElement('canvas');
            canvas.width = 768;
            canvas.height = 768;
            const ctx = canvas.getContext('2d');
            const size = 768;
            const center = size / 2;
            const base = new THREE.Color(colorHex);
            const inner = 0.31;
            const outer = 0.49;
            const image = ctx.createImageData(size, size);

            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    const dx = (x - center) / center;
                    const dy = (y - center) / center;
                    const radius = Math.sqrt(dx * dx + dy * dy);
                    const angle = Math.atan2(dy, dx);
                    const radialT = (radius - inner) / (outer - inner);
                    const idx = (y * size + x) * 4;
                    if (radialT < 0 || radialT > 1) continue;

                    const edgeFade = Math.sin(Math.PI * radialT);
                    const saturnBands = 0.62 + 0.22 * Math.sin(radialT * 58 + seed * 0.01);
                    const fineBands = 0.86 + 0.12 * Math.sin(radialT * 180 + Math.sin(angle * 5) * 1.8);
                    const azimuth = 0.88 + 0.12 * Math.sin(angle * 7 + seed * 0.003);
                    const gap = Math.abs(radialT - 0.58) < 0.028 ? 0.34 : 1;
                    const noise = 0.9 + 0.1 * Math.sin((x * 12.9898 + y * 78.233 + seed) * 0.035);
                    const alpha = Math.pow(edgeFade, 1.75) * saturnBands * fineBands * azimuth * gap * noise;
                    const shade = 0.78 + radialT * 0.28;

                    image.data[idx] = Math.min(255, base.r * 255 * shade);
                    image.data[idx + 1] = Math.min(255, base.g * 255 * shade);
                    image.data[idx + 2] = Math.min(255, base.b * 255 * shade);
                    image.data[idx + 3] = Math.floor(alpha * 210);
                }
            }

            ctx.putImageData(image, 0, 0);
            for (let i = 0; i < 22; i++) {
                const r = randomRange(random, inner + 0.02, outer - 0.02) * center;
                ctx.beginPath();
                ctx.arc(center, center, r, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(255,255,255,${randomRange(random, 0.01, 0.035)})`;
                ctx.lineWidth = randomRange(random, 0.7, 2.2);
                ctx.stroke();
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.minFilter = THREE.LinearFilter;
            texture.magFilter = THREE.LinearFilter;
            texture.needsUpdate = true;
            return texture;
        }

        function createAccretionDiskTexture(seed, innerHue = 35, outerHue = 22) {
            const random = createSeededRandom(seed);
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            const size = 1024;
            const center = size / 2;
            const image = ctx.createImageData(size, size);

            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    const dx = (x - center) / center;
                    const dy = (y - center) / center;
                    const radius = Math.sqrt(dx * dx + dy * dy);
                    const angle = Math.atan2(dy, dx);
                    const inner = 0.16;
                    const outer = 0.48;
                    const t = (radius - inner) / (outer - inner);
                    if (t < 0 || t > 1) continue;

                    const hotEdge = Math.exp(-Math.pow((t - 0.12) * 5.2, 2));
                    const band = 0.55 + 0.35 * Math.sin(t * 70 + angle * 2.2 + seed * 0.02);
                    const spiral = 0.72 + 0.26 * Math.sin(angle * 5.0 + t * 34 + seed * 0.01);
                    const turbulence = 0.86 + 0.14 * Math.sin((x * 19.91 + y * 7.31 + seed) * 0.018);
                    const edgeFade = Math.sin(Math.PI * t);
                    const alpha = Math.pow(edgeFade, 0.72) * (0.45 + hotEdge * 0.95) * band * spiral * turbulence;
                    const hue = outerHue + hotEdge * (innerHue - outerHue);
                    const light = 38 + hotEdge * 48 + (1 - t) * 18;
                    const color = new THREE.Color().setHSL(hue / 360, 0.95, Math.min(0.86, light / 100));
                    const idx = (y * size + x) * 4;
                    image.data[idx] = color.r * 255;
                    image.data[idx + 1] = color.g * 255;
                    image.data[idx + 2] = color.b * 255;
                    image.data[idx + 3] = Math.floor(Math.min(1, alpha) * 255);
                }
            }

            ctx.putImageData(image, 0, 0);
            for (let i = 0; i < 120; i++) {
                const r = randomRange(random, 120, 445);
                const a = random() * Math.PI * 2;
                const x = center + Math.cos(a) * r;
                const y = center + Math.sin(a) * r;
                ctx.fillStyle = `rgba(255,230,170,${randomRange(random, 0.03, 0.11)})`;
                ctx.fillRect(x, y, randomRange(random, 1, 4), randomRange(random, 1, 4));
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.minFilter = THREE.LinearFilter;
            texture.magFilter = THREE.LinearFilter;
            texture.needsUpdate = true;
            return texture;
        }

        function createAdvancedBlackHoleVisual(seed, options = {}) {

        function collectLocalBlackHoleLensData(maxCount = 5) {
            const lenses = [];
            camera.updateMatrixWorld();
            lensCameraRight.setFromMatrixColumn(camera.matrixWorld, 0).normalize();
            for (const blackHole of localBlackHoles) {
                if (!blackHole.group.parent || blackHole.group.visible === false) continue;
                blackHole.group.getWorldPosition(lensTempCenter);
                lensTempProjected.copy(lensTempCenter).project(camera);
                if (lensTempProjected.z < -1 || lensTempProjected.z > 1) continue;
                lensTempEdge.copy(lensTempCenter).addScaledVector(lensCameraRight, blackHole.lensRadius);
                const edgeProjected = lensTempEdge.project(camera);
                const radius = Math.min(0.34, Math.max(0.06, Math.abs(edgeProjected.x - lensTempProjected.x) * 0.72));
                lenses.push({
                    x: lensTempProjected.x * 0.5 + 0.5,
                    y: lensTempProjected.y * 0.5 + 0.5,
                    radius,
                    strength: blackHole.strength
                });

        function generateCloudTexture(width, height, seed) {
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            const simplex = new SimplexNoise(createSeededRandom(seed));
            const image = ctx.createImageData(width, height);
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const u = x / width;
                    const v = y / height;
                    const latitudeFade = Math.pow(Math.sin(v * Math.PI), 0.28);
                    const broad = simplex.noise3D(u * 4.2, v * 2.1, seed * 0.001) * 0.56;
                    const detail = simplex.noise3D(u * 11.5, v * 5.7, seed * 0.002) * 0.28;
                    const wisps = simplex.noise3D(u * 24.0, v * 9.2, seed * 0.003) * 0.12;
                    const n = broad + detail + wisps;
                    const coverage = Math.max(0, Math.min(1, (n + 0.32) * 1.55)) * latitudeFade;
                    const alpha = Math.pow(coverage, 1.25) * 245;
                    const shade = 218 + Math.floor(37 * Math.max(0, detail + 0.35));
                    const idx = (y * width + x) * 4;
                    image.data[idx] = shade;
                    image.data[idx + 1] = Math.min(255, shade + 4);
                    image.data[idx + 2] = 255;
                    image.data[idx + 3] = alpha;
                }
            }
            ctx.putImageData(image, 0, 0);
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.ClampToEdgeWrapping;
            texture.minFilter = THREE.LinearFilter;
            texture.magFilter = THREE.LinearFilter;
            texture.needsUpdate = true;
            return texture;
        }

            createCloudLayer(seed, profile);

        }
        
        // Função para gerar um seed aleatório
        function generateRandomSeed() {

        // Geração de textura de cor procedural baseada em altura + ruído, com paletas distintas e vibrantes
        function generatePlanetTexture(width, height, seedVal, heightMapData, profile) {
            // Usamos um canvas para criar textura de alta qualidade
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            
            // Array para armazenar cores por pixel (simplificamos com base na altitude simulada)
            // Vamos criar uma paleta dinâmica que depende do seed: tons de oceano, terra, neve, desertos, florestas
            // Para isso, criamos geradores de cores baseados em ruído adicional e funções trigonométricas do seed.
            
            // Pré-definir paletas usando o seed para variedade
            const rng = (min, max) => min + ( (seedVal * 9301 + 49297) % 233280) / 233280 * (max - min);
            // Usamos um pseudo aleatório mais controlado
            function seededRandom(seedVal, x, y) {
                const val = Math.sin(seedVal * 12.9898 + x * 78.233 + y * 37.719) * 43758.5453;
                return val - Math.floor(val);
            }
            
            // Escolhe estilo de planeta baseado no seed: "terrestre", "gelado", "vulcânico", "alienígena"
            const styleChoice = profile?.styleIndex ?? (seedVal % 4);
            let oceanBase, landBase, highBase, snowColor, desertColor, forestColor;
            
            if (styleChoice === 0) { // Terrestre / Oceânico
                oceanBase = [0x2a6f8f, 0x3a86a5, 0x4c9fbf];
                landBase = [0x6a9e4b, 0x7cb256, 0x8bc34a];
                highBase = [0xbc9a6c, 0xcbab77, 0xa57c4c];
                snowColor = [0xeef4ff, 0xffffff];
                desertColor = [0xe3c194, 0xd4b87a];
                forestColor = [0x5d8c48, 0x4e7a3a];
            } else if (styleChoice === 1) { // Vulcânico / Magma
                oceanBase = [0x441111, 0x662222, 0x883333];
                landBase = [0xaa5533, 0xcc6644, 0xaa4422];
                highBase = [0xdd8844, 0xee9955];
                snowColor = [0xffcc88, 0xffaa66];
                desertColor = [0xcc7744, 0xbb6633];
                forestColor = [0x994422, 0x883311];
            } else if (styleChoice === 2) { // Gélido
                oceanBase = [0x557799, 0x6688aa, 0x7799bb];
                landBase = [0xbbccdd, 0xaaccdd, 0x99bbcc];
                highBase = [0xeeeeff, 0xffffff];
                snowColor = [0xf0f8ff, 0xe6f2ff];
                desertColor = [0xcceeff, 0xb8d8ff];
                forestColor = [0x88aacc, 0x77aacc];
            } else if (styleChoice === 3) {
                oceanBase = [0x8f2a6f, 0xa53a86, 0xbf4c9f];
                landBase = [0x9e6a4b, 0xb27c56, 0xc38b4a];
                highBase = [0xbc9afc, 0xcbabff];
                snowColor = [0xddbbff, 0xeeccff];
                desertColor = [0xe3c1d4, 0xd4b8ca];
                forestColor = [0x8c5d48, 0x7a4e3a];
            } else if (styleChoice === 4) { // Desertico
                oceanBase = [0x8b4e2f, 0xa9633b, 0xc9834e];
                landBase = [0xc9985b, 0xd7ad6c, 0xe1bd7b];
                highBase = [0x9d6c4a, 0x7d5b48];
                snowColor = [0xe8d2aa, 0xffdfaa];
                desertColor = [0xd9a75f, 0xba7540];
                forestColor = [0xa2693e, 0x855333];
            } else { // Gigante gasoso
                oceanBase = [0xb57a55, 0xd5a36f, 0xf0d09c];
                landBase = [0x8f6a55, 0xc48d67, 0xf2c98b];
                highBase = [0xffddb0, 0xf7b875];
                snowColor = [0xfff2d1, 0xffd7a3];
                desertColor = [0x9f6d61, 0x754c52];
                forestColor = [0xb88968, 0xe2b475];
            }
            
            // Função para interpolar entre cores baseado na altura (0 a 1)
            const getColorByHeight = (h, xPixel, yPixel) => {
                // ruído extra para variabilidade local na cor
                const grain = (seededRandom(seedVal, xPixel * 0.02, yPixel * 0.02) * 0.15) - 0.075;
                let adjH = Math.min(0.99, Math.max(0.01, h + grain));
                const oceanLevel = profile?.type === 'gas' ? 0.25 : Math.max(0.02, Math.min(0.78, editorState.waterLevel));
                
                if (adjH < oceanLevel) { // oceano profundo -> raso
                    const t = adjH / oceanLevel;
                    const idx = Math.floor(t * (oceanBase.length - 1));
                    const c1 = oceanBase[idx];
                    return c1;
                } else if (adjH < 0.55) { // terras baixas / florestas / desertos
                    const t = (adjH - 0.25) / 0.3;
                    if (t < 0.6) {
                        const idxLand = Math.floor(t * 2);
                        return landBase[idxLand % landBase.length];
                    } else {
                        return desertColor[Math.floor((t-0.6)*3) % desertColor.length];
                    }
                } else if (adjH < 0.85) { // montanhas / rochas
                    const t = (adjH - 0.55) / 0.3;
                    const idxM = Math.floor(t * highBase.length);
                    return highBase[idxM % highBase.length];
                } else { // picos nevados / topos
                    const t = (adjH - 0.85) / 0.15;
                    const idxS = Math.floor(t * snowColor.length);
                    return snowColor[idxS % snowColor.length];
                }
            };
            
            // Pré-processar altura em 2D: vamos simular a partir de um mapa de altura já calculado? 
            // Na verdade, podemos gerar uma textura com ruído Simplex para a cor também, mas para simplicidade e performance,
            // usamos o heightMapData (que veio do ruído) para pintar cada pixel de acordo com a altura "uv".
            // Vamos usar o heightMapData passado como referência, mas como a esfera usa UV mapping, podemos simular cores baseadas na posição UV.
            // Mas para garantir coerência visual, usaremos os valores de altitude que foram gerados no vértice? 
            // Por simplicidade e melhor performance no canvas, criamos uma textura baseada em ruído procedural novamente,
            // mas sincronizada com o mesmo seed e usando coordenadas UV.
            
            // Criar imagem de textura: itera sobre cada pixel, mapeia coordenada esférica, calcula noise similar ao do vertex shader (mas em CPU)
            // Isso dará textura de superfície rica.
            const simplex = new SimplexNoise(createSeededRandom(seedVal));
            
            for (let i = 0; i < width; i++) {
                for (let j = 0; j < height; j++) {
                    // uv: u = i/width, v = j/height
                    const u = i / width;
                    const v = j / height;
                    // Converter UV para direção esférica: theta = 2*PI*u, phi = PI*v
                    const theta = u * Math.PI * 2;
                    const phi = v * Math.PI;
                    const xDir = Math.sin(phi) * Math.cos(theta);
                    const yDir = Math.cos(phi);
                    const zDir = Math.sin(phi) * Math.sin(theta);
                    
                    // Calcular ruído 3D para altura (coerente com a geometria)
                    const freq1 = 2.35;
                    const freq2 = 5.4;
                    const freq3 = 10.2;
                    const amp1 = 0.72;
                    const amp2 = 0.2;
                    const amp3 = 0.08;
                    
                    let n1 = simplex.noise3D(xDir * freq1, yDir * freq1, zDir * freq1);
                    let n2 = simplex.noise3D(xDir * freq2, yDir * freq2, zDir * freq2);
                    let n3 = simplex.noise3D(xDir * freq3, yDir * freq3, zDir * freq3);
                    // elevação entre -1 e 1 e mapping para 0-1
                    let heightVal = (n1 * amp1 + n2 * amp2 + n3 * amp3) * 0.68 + 0.5;
                    // Adicionar pequena distorção continental
                    let continentNoise = simplex.noise3D(xDir * 0.9, yDir * 0.9, zDir * 0.9) * 0.16;
                    heightVal = Math.min(0.98, Math.max(0.02, heightVal + continentNoise));
                    
                    // Cor baseada na altura e no estilo definido
                    let colorHex = getColorByHeight(heightVal, i, j);
                    if (profile?.type === 'gas') {
                        const storm = simplex.noise3D(xDir * 9.5, yDir * 1.2, zDir * 9.5) * 0.08 * editorState.stormIntensity;
                        const bands = Math.sin((v + storm) * Math.PI * (16 + editorState.stormIntensity * 10));
                        const latitude = Math.abs(v - 0.5) * 2;
                        if (bands > 0.48) colorHex = highBase[Math.floor(Math.abs(bands) * highBase.length) % highBase.length];
                        else if (bands < -0.45) colorHex = desertColor[Math.floor(Math.abs(bands) * desertColor.length) % desertColor.length];
                        else colorHex = latitude > 0.72 ? landBase[0] : oceanBase[Math.floor((heightVal + latitude) * oceanBase.length) % oceanBase.length];
                    }
                    // Extrair RGB
                    let r = ((colorHex >> 16) & 255) / 255;
                    let g = ((colorHex >> 8) & 255) / 255;
                    let b = (colorHex & 255) / 255;
                    
                    // Adicionar variação de brilho baseada em ruído adicional
                    const microVar = simplex.noise3D(xDir * 13, yDir * 13, zDir * 13) * 0.07;
                    r = Math.min(1, Math.max(0.16, r + microVar));
                    g = Math.min(1, Math.max(0.16, g + microVar));
                    b = Math.min(1, Math.max(0.16, b + microVar));
                    
                    // Estilização especial para planeta vulcânico: mais vermelho nas altitudes médias
                    if (styleChoice === 1 && heightVal > 0.4 && heightVal < 0.7) {
                        r += 0.2;
                        g *= 0.7;
                        b *= 0.5;
                    }
                    if (styleChoice === 2 && heightVal > 0.7) {
                        r = 0.9; g = 0.95; b = 1.0;
                    }
                    
                    ctx.fillStyle = `rgb(${Math.floor(r*255)}, ${Math.floor(g*255)}, ${Math.floor(b*255)})`;
                    ctx.fillRect(i, j, 1, 1);
                }
            }
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.ClampToEdgeWrapping;
            texture.needsUpdate = true;
            return texture;
        }
        
        // Criação da malha do planeta com geometria esférica de alta resolução e deslocamento de vértices
        function createCentralStar(seed, profile) {

            const corona = new THREE.Mesh(

        function calculatePlanetSurfaceOffset(normal, profile, simplex) {
            if (!normal || !simplex || !profile) return 0;
            const relief = profile.relief * editorState.mountainIntensity;
            const amp1 = 0.075 * PLANET_RADIUS * relief;
            const amp2 = 0.026 * PLANET_RADIUS * relief;
            const amp3 = 0.01 * PLANET_RADIUS * relief;
            let noiseVal = simplex.noise3D(normal.x * 2.1, normal.y * 2.1, normal.z * 2.1) * amp1;
            noiseVal += simplex.noise3D(normal.x * 4.8, normal.y * 4.8, normal.z * 4.8) * amp2;
            noiseVal += simplex.noise3D(normal.x * 8.5, normal.y * 8.5, normal.z * 8.5) * amp3;
            noiseVal += simplex.noise3D(normal.x * 0.85, normal.y * 0.85, normal.z * 0.85) * 0.022 * PLANET_RADIUS * relief;
            const minOffset = -0.06 * PLANET_RADIUS;
            const maxOffset = 0.11 * PLANET_RADIUS;
            return Math.min(maxOffset, Math.max(minOffset, noiseVal)) * editorState.deformation;
        }

        function samplePlanetSurfaceHeight(normal) {
            if (!surfaceSampler || !normal) return 0;
            const unitNormal = normal.clone ? normal.clone().normalize() : new THREE.Vector3(normal.x, normal.y, normal.z).normalize();
            return calculatePlanetSurfaceOffset(unitNormal, surfaceSampler.profile, surfaceSampler.simplex);
        }

        function generatePlanet(seed) {
            if (isRegeneratingPlanet) return;
            surfaceExploration.exitExplorationMode({ silent: true });
            isRegeneratingPlanet = true;
            try {
                generatePlanetInternal(seed);
            } finally {
                removeInvalidRenderableObjects(scene);
                needsRenderListFlush = true;
                isRegeneratingPlanet = false;
            }
        }

        function generatePlanetInternal(seed) {
            clearCosmicGroup();
            
            currentSeed = seed;
            currentProfile = choosePlanetProfile(seed);
            document.getElementById('seedDisplay').innerText = `semente: ${seed} | ${currentProfile.name} | ${currentThemeName}`;
            applyLiveEnvironmentSettings();
            const composeRandom = createSeededRandom(seed + 2024);
            cosmicGroup.position.set(randomRange(composeRandom, -0.18, 0.24), randomRange(composeRandom, -0.08, 0.12), 0);

            if (currentProfile.type === 'star') {
                createCentralStar(seed, currentProfile);
                planetChaos?.setPlanet(currentPlanetMesh?.isMesh ? currentPlanetMesh : null, planetSurfaceGroup);
                vegetationSystem.generateForPlanet({ seed, profile: currentProfile, planetMesh: currentPlanetMesh });
                dinoLife.setPlanetInfo({ radius: PLANET_RADIUS, seed, profile: currentProfile, planetMesh: currentPlanetMesh });
                dinoLife.regeneratePopulation();
                return;
            }
            if (currentProfile.type === 'blackhole') {
                createCentralBlackHole(seed, currentProfile);
                planetChaos?.setPlanet(currentPlanetMesh?.isMesh ? currentPlanetMesh : null, planetSurfaceGroup);
                vegetationSystem.generateForPlanet({ seed, profile: currentProfile, planetMesh: currentPlanetMesh });
                dinoLife.setPlanetInfo({ radius: PLANET_RADIUS, seed, profile: currentProfile, planetMesh: currentPlanetMesh });
                dinoLife.regeneratePopulation();
                return;
            }
            
            // Inicializa o ruído Simplex com a semente
            simplexNoise = new SimplexNoise(createSeededRandom(seed));
            surfaceSampler = { seed, profile: currentProfile, simplex: simplexNoise };
            const simplex = simplexNoise;
            
            // Geometria da esfera com segmentos suficientes para relevo suave
            const segments = window.innerWidth < 700 ? 112 : 160;
            const geometry = new THREE.SphereGeometry(PLANET_RADIUS, segments, segments);
            const positions = geometry.attributes.position.array;
            
            // Armazenar alturas para possível uso futuro na textura (opcional)
            const heightMap = new Array(positions.length / 3);
            
            // Deslocar vértices baseado no noise 3D
            for (let i = 0; i < positions.length; i += 3) {
                const x = positions[i];
                const y = positions[i+1];
                const z = positions[i+2];
                // Normalizar direção (já que é esfera unitária)
                const nx = x, ny = y, nz = z;
                const magnitude = Math.hypot(nx, ny, nz);
                const normX = nx / magnitude;
                const normY = ny / magnitude;
                const normZ = nz / magnitude;
                
                // Múltiplas frequências de ruído para terreno realista
                
                // Adicionar um "continente" de baixa frequência
                
                // Limitar entre -0.12 e 0.18 para não ficar extremo mas visível
                let offset = calculatePlanetSurfaceOffset(new THREE.Vector3(normX, normY, normZ), currentProfile, simplex);
                // Ajuste final: raio base 1 + deslocamento
                const newRadius = PLANET_RADIUS + offset;
                heightMap[i/3] = (offset / PLANET_RADIUS + 0.12) / 0.32; // normalizado entre 0 e 1 aprox.
                positions[i] = normX * newRadius;
